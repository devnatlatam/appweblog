# /etc/nginx/sites-available/syslogweb   (luego: ln -s a sites-enabled y recargar nginx)
# Reemplaza logs.tu-dominio.com por tu dominio. Certbot agrega el bloque HTTPS por ti.
server {
    listen 80;
    server_name logs.tu-dominio.com;

    root /opt/syslogweb/client/dist;
    index index.html;

    # La API: solo nginx llega a ella (escucha en 127.0.0.1:4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tiempo real (WebSocket)
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # La web: cualquier ruta desconocida devuelve index.html (la app maneja sus propias rutas)
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
